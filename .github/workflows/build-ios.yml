# iPadOS / iOS (.ipa) ビルド
#
# 必要な GitHub Secrets（Settings → Secrets and variables → Actions）:
#
#   BUILD_CERTIFICATE_BASE64   Apple Distribution（または Development）証明書を
#                              Keychain Access から .p12 で書き出し、base64 エンコードした値
#                              macOS:  base64 -i certificate.p12 | pbcopy
#   P12_PASSWORD               上記 .p12 を書き出したときのパスワード
#   PROVISION_PROFILE_BASE64   .mobileprovision を base64 エンコードした値
#                              macOS:  base64 -i profile.mobileprovision | pbcopy
#   APPLE_DEVELOPMENT_TEAM     Apple Developer Team ID（10 文字。会員情報ページに記載）
#
# 任意:
#   KEYCHAIN_PASSWORD          CI 用一時キーチェーンのパスワード。未設定ならジョブ内で生成する
#
# 補足:
#   - Bundle ID は src-tauri/tauri.conf.json の identifier（com.mitra.blueprintsync）と
#     プロビジョニングプロファイルの App ID を一致させる
#   - App Store 配布なら「Apple Distribution」証明書 + App Store Connect プロファイル
#   - 登録済み iPad へ直接入れるなら Ad Hoc プロファイルを使い、export_method を release-testing にする
#   - src-tauri/gen/apple は gitignore 対象のため、CI 上で `tauri ios init --ci` する
#
name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: "IPA の export method（Xcode 16+: app-store-connect / release-testing / debugging）"
        required: true
        type: choice
        default: app-store-connect
        options:
          - app-store-connect
          - release-testing
          - debugging
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  # Tauri CLI の対話プロンプトをスキップする
  CI: true

jobs:
  build-ios:
    name: Build IPA
    runs-on: macos-14
    timeout-minutes: 60

    env:
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
      # Tauri CLI の手動署名（IOS_*）にも同じ成果物を渡す
      IOS_CERTIFICATE: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.P12_PASSWORD }}
      IOS_MOBILE_PROVISION: ${{ secrets.PROVISION_PROFILE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Add iOS Rust target
        run: rustup target add aarch64-apple-ios

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Setup CocoaPods
        run: |
          set -euo pipefail
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version

      - name: Validate signing secrets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          missing=0
          for name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD PROVISION_PROFILE_BASE64 APPLE_DEVELOPMENT_TEAM; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub Secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Repository Settings → Secrets and variables → Actions に不足分を登録してください。"
            exit 1
          fi

      - name: Import certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-$(openssl rand -base64 32)}"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          echo "Signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          # Xcode 15 以前と Xcode 16 以降の両方にインストールする
          PP_UUID="$(security cms -D -i "$PP_PATH" | plutil -extract UUID raw -)"
          LEGACY_PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          XCODE16_PP_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$LEGACY_PP_DIR" "$XCODE16_PP_DIR"
          cp "$PP_PATH" "$LEGACY_PP_DIR/$PP_UUID.mobileprovision"
          cp "$PP_PATH" "$XCODE16_PP_DIR/$PP_UUID.mobileprovision"
          echo "Installed provisioning profile UUID=$PP_UUID"

          {
            echo "IOS_KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "IOS_PP_UUID=$PP_UUID"
          } >> "$GITHUB_ENV"

      - name: Initialize iOS project
        run: npm run tauri ios init -- --ci

      - name: Build iOS IPA
        run: |
          set -euo pipefail
          EXPORT_METHOD="${{ github.event.inputs.export_method || 'app-store-connect' }}"
          echo "export-method=$EXPORT_METHOD"
          npm run tauri ios build -- --ci --target aarch64 --export-method "$EXPORT_METHOD"

      - name: Locate IPA
        run: |
          set -euo pipefail
          IPA_PATH="$(find src-tauri/gen/apple -name '*.ipa' -type f | head -n 1)"
          if [ -z "${IPA_PATH:-}" ]; then
            echo "IPA が見つかりませんでした。src-tauri/gen/apple の内容:"
            find src-tauri/gen/apple -type f | head -n 100
            exit 1
          fi
          echo "Found IPA: $IPA_PATH"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: blueprint-sync-ios
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Clean up keychain and provisioning profile
        if: always()
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="${IOS_KEYCHAIN_PATH:-$RUNNER_TEMP/app-signing.keychain-db}"
          security delete-keychain "$KEYCHAIN_PATH" || true
          if [ -n "${IOS_PP_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${IOS_PP_UUID}.mobileprovision"
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/${IOS_PP_UUID}.mobileprovision"
          fi
          rm -f "$RUNNER_TEMP/build_certificate.p12" "$RUNNER_TEMP/build_pp.mobileprovision"
