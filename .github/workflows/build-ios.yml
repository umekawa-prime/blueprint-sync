# iPadOS / iOS 未署名 IPA（SideStore / AltStore 向け）
#
# 有料の Apple Developer Program は不要。GitHub Secrets も不要。
# 生成される .ipa は未署名なので、iPad では SideStore などが無料 Apple ID で再署名して入れる。
#
# 補足:
#   - Bundle ID は src-tauri/tauri.conf.json の identifier（com.mitra.blueprintsync）
#   - src-tauri/gen/apple は gitignore 対象のため、CI 上で `tauri ios init --ci` する
#   - APPLE_DEVELOPMENT_TEAM は init 用のダミー。実証明書は使わない
#
name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  CI: true
  # tauri ios init が Team ID を要求するためだけに置く。署名には使わない
  APPLE_DEVELOPMENT_TEAM: AAAAAAAAAA

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Add iOS Rust target
        run: rustup target add aarch64-apple-ios

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Setup CocoaPods
        run: |
          set -euo pipefail
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version

      - name: Initialize iOS project
        run: npm run tauri ios init -- --ci

      - name: Disable code signing in Xcode project
        run: |
          set -euo pipefail
          PBX="$(find src-tauri/gen/apple -name project.pbxproj | head -n 1)"
          if [ -z "$PBX" ]; then
            echo "project.pbxproj が見つかりません"
            find src-tauri/gen/apple -maxdepth 3 -type f | head -n 50
            exit 1
          fi
          sed -i '' \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            -e 's/CODE_SIGN_IDENTITY = "[^"]*";/CODE_SIGN_IDENTITY = "";/g' \
            -e 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/g' \
            "$PBX"
          echo "patched $PBX"

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          if npm run tauri ios build -- --help 2>&1 | grep -q -- "--no-sign"; then
            npm run tauri ios build -- --ci --target aarch64 --no-sign
          else
            # 古い CLI は export で落ちることがある。アーカイブまで進めば後続で IPA 化する
            npm run tauri ios build -- --ci --target aarch64 || true
          fi

      - name: Package IPA for SideStore
        run: |
          set -euo pipefail

          mkdir -p artifacts
          IPA_PATH="$(find src-tauri/gen/apple -name '*.ipa' -type f | head -n 1 || true)"

          if [ -z "${IPA_PATH:-}" ]; then
            APP_PATH="$(
              find src-tauri/gen/apple \
                ~/Library/Developer/Xcode/DerivedData \
                -name '*.app' -type d 2>/dev/null \
                | grep -E 'iphoneos|Products/Applications|apple/build' \
                | head -n 1 || true
            )"
            if [ -z "${APP_PATH:-}" ]; then
              echo "未署名の .app / .ipa が見つかりませんでした"
              find src-tauri/gen/apple -type f | head -n 100
              exit 1
            fi
            echo "Packaging app bundle: $APP_PATH"
            WORK="$RUNNER_TEMP/ipa-payload"
            rm -rf "$WORK"
            mkdir -p "$WORK/Payload"
            cp -R "$APP_PATH" "$WORK/Payload/"
            (cd "$WORK" && zip -qr "$GITHUB_WORKSPACE/artifacts/BlueprintSync.ipa" Payload)
            IPA_PATH="$GITHUB_WORKSPACE/artifacts/BlueprintSync.ipa"
          else
            cp "$IPA_PATH" artifacts/BlueprintSync.ipa
            IPA_PATH="$GITHUB_WORKSPACE/artifacts/BlueprintSync.ipa"
          fi

          echo "IPA: $IPA_PATH"
          ls -lh "$IPA_PATH"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: blueprint-sync-ios
          path: artifacts/BlueprintSync.ipa
          if-no-files-found: error
          retention-days: 14
